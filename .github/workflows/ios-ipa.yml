name: iOS IPA

# 产出未签名 IPA（Runner.app 打成 Payload/），App Store / 自签工具之后再签。
#
# 为什么单独一个 workflow：android-apk.yml 和 windows.yml 都跑在 Linux/Windows
# runner 上，而 iOS 只能在 macOS runner 上编。上游一直没有 iOS 的 CI job，所以
# 仓库里只有 ios/ 工程和 IOS.md，却从来没有发布过 IPA。
#
# 未签名 = 不需要证书、不需要 DEVELOPMENT_TEAM、不需要任何 secret，
# 免费公开仓库也能跑；产物用 Sideloadly / AltStore / SideStore 自签即可安装。

on:
  push:
    branches: [master]
    tags: ['v*']
    paths: &ios_paths
      - 'lib/**'
      - 'ios/**'
      - 'native/**'
      - 'rust/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'flutter_rust_bridge.yaml'
      - 'scripts/build_rust_ios.sh'
      - 'scripts/generate_ios_app_icon.py'
      - '.github/workflows/ios-ipa.yml'
  pull_request:
    paths: *ios_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须与 pubspec.lock / android-apk.yml 保持一致：pubspec.lock 按 3.47 解析，
  # 换版本会让 --enforce-lockfile 失败。Xcode 27 的适配补丁在 3.47.0 才进。
  FLUTTER_VERSION: '3.47.9'
  # 与 rust/Cargo.toml 里 flutter_rust_bridge = "=2.13.0" 对应，codegen 与 crate 必须同版本。
  FRB_VERSION: '2.13.0'
  # IOS.md 记录的验证版本。GitHub 的 macos-* runner 预装 Rust，但版本会漂，
  # 显式钉住才能复现作者的构建。
  RUST_VERSION: '1.99.1'
  APP_NAME: fqapp

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show runner toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          xcode-select -p || true
          pod --version || true

      # 选最新的 Xcode，不硬编码版本号：镜像里同时装了 Xcode 16.x / 26.x，更新时路径会变。
      # macos-15 (arm64) 在这个账号上长期抢不到 runner，macos-15-intel 可以，且带 Xcode 26.3
      # （Xcode 15.4 的 SDK 缺 NWPath.isUltraConstrained 等 iOS 26 API，编译不过）。
      - name: Select newest stable Xcode
        run: |
          ls /Applications | grep -E '^Xcode.*\.app$' || true
          XC="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] || XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # IOS.md：Xcode 27 + SPM 有已知构建失败，必须关掉。
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked

      # scripts/generate_app_icons.py 头部写明依赖 Pillow >= 9.1（Image.Resampling）。
      # runner 上的 python3 是 Homebrew 的，PEP 668 下可能需要 --break-system-packages。
      - name: Install Pillow (icon generator dependency)
        run: |
          python3 -m pip install --user "Pillow>=9.1" \
            || python3 -m pip install --break-system-packages "Pillow>=9.1"
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      # 生成 iOS 用的 1024 无 alpha 图标（脚本按 assets/branding/app_icon_source.png 出图）。
      # 只在图标源缺失时才跳过，其余错误照常失败，不静默降级。
      - name: Generate iOS app icon
        run: |
          if [ -f assets/branding/app_icon_source.png ]; then
            python3 scripts/generate_ios_app_icon.py
          else
            echo "::warning::assets/branding/app_icon_source.png 缺失，沿用仓库里的图标"
          fi

      # Team ID 不入库，未签名构建不需要它；占位值让 xcconfig 的 include 能解析。
      # CI 里绝不写自己的 Team，见 IOS.md「别在 Xcode Signing 页里再选一次 Team」。
      - name: Provide placeholder signing config
        run: cp ios/Flutter/Signing.xcconfig.example ios/Flutter/Signing.xcconfig

      # Rust 核心 → ios/Frameworks/libfqapi_core.a（iOS 不允许 dlopen，静态链进主二进制）
      - name: Build Rust core (staticlib, device arm64)
        run: bash ./scripts/build_rust_ios.sh

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update

      # macos-15（Xcode 16+）在这个账号上长期抢不到 runner，只能用 macos-14 的 Xcode 15.4。
      # 但 Swift 5.10 不接受「调用参数列表的尾随逗号」（Swift 6.1 才支持），
      # 而 Pigeon 生成的 messages.g.swift 里就有 `type: Int,` / `suiteName: ...,` 这种写法，
      # 会报 "Unexpected ',' separator"。这里在构建前把这些尾随逗号改掉。
      # 只动生成文件；不改版本、不改 lockfile。
      - name: Patch Pigeon trailing commas (Xcode 15 / Swift 5.10)
        run: |
          python3 - <<'PY'
          import pathlib, re
          roots = [pathlib.Path.home() / '.pub-cache', pathlib.Path('ios/Pods')]
          total = 0
          for root in roots:
              if not root.is_dir():
                  continue
              for f in root.rglob('messages.g.swift'):
                  src = f.read_text(encoding='utf-8')
                  # 只去掉紧贴右括号的尾随逗号，正常参数分隔符不会匹配到
                  out = re.sub(r',(\s*)\)', r'\1)', src)
                  if out != src:
                      f.write_text(out, encoding='utf-8')
                      total += 1
                      print('patched', f)
          print(f'patched {total} file(s)')
          PY

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          rm -rf build/ios/pack && mkdir -p build/ios/pack/Payload
          ditto "$APP" build/ios/pack/Payload/Runner.app
          cd build/ios/pack
          zip -qry "$GITHUB_WORKSPACE/${APP_NAME}_ios_unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "${APP_NAME}_ios_unsigned.ipa" > "${APP_NAME}_ios_unsigned.ipa.sha256"
          cat "${APP_NAME}_ios_unsigned.ipa.sha256"
          unzip -l "${APP_NAME}_ios_unsigned.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.APP_NAME }}-ios-unsigned-${{ github.sha }}
          path: |
            ${{ env.APP_NAME }}_ios_unsigned.ipa
            ${{ env.APP_NAME }}_ios_unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      # 打 tag（v*）推上来时顺手附到 Release，等于让仓库终于有现成 IPA 可下。
      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}_ios_unsigned.ipa
            ${{ env.APP_NAME }}_ios_unsigned.ipa.sha256
          fail_on_unmatched_files: true
